;==========================================================;
;                                                          ;
;              Nikhil Polybar Configuration                ;
;                                                          ;
;==========================================================;

[settings]
; Enable live module updates via `polybar-msg action <module> <action>`
enable-ipc = true

;==========================================================;
;                 Color Palette                            ;
;==========================================================;

[colors]
background = #111111
foreground = #EEEEEE
disabled   = #777777

primary   = #5E81AC
secondary = #B48EAD

alert   = #D95B5B
green   = #249824
blue    = #60FFF7
orange  = #FFAF60

;==========================================================;
;                      Main Bar                            ;
;==========================================================;

[bar/main]
width  = 99%
height = 24
radius = 8
bottom = false
override-redirect = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size  = 2
line-color = ${colors.primary}

separator            = " │ "
separator-foreground = ${colors.disabled}

; font-0=T1 (text regular), font-1=T2 (text bold), font-2=T3 (FA solid icons), font-3=T4 (FA brand icons)
; font-4=T5 (DejaVu Sans) — fallback for glyphs missing from the above, e.g. the wifi ramp's block elements
font-0 = Droid Sans:size=11:weight=regular;
font-1 = Droid Sans:size=11:weight=bold;
font-2 = Font Awesome 6 Free Solid:style=Solid:size=12;
font-3 = Font Awesome 6 Brands Regular:style=Regular:size=12;
font-4 = DejaVu Sans:size=11;

modules-left   = workspaces settings appfilemanager
modules-center = date
modules-right  = cpu memory sound ethernet wifi vpn bluetooth battery powermenu

;==========================================================;
;                  Modules: Left                           ;
;==========================================================;

[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true

format = <label-state> <label-mode>
label-mode-padding    = 1
label-mode-background = ${colors.primary}

label-focused           = %index%
label-focused-padding   = 2
label-focused-underline = ${colors.green}

label-visible           = %index%
label-visible-padding   = 2
label-visible-underline = ${colors.secondary}

label-unfocused            = %index%
label-unfocused-padding    = 2
label-unfocused-foreground = ${colors.disabled}

label-urgent            = %index%
label-urgent-padding    = 2
label-urgent-background = ${colors.alert}


[module/settings]
type          = custom/text
format = %{T3}%{T-}
format-padding = 1
click-left    = sh ~/.config/polybar/settings.sh &

[module/appfilemanager]
type          = custom/text
format = %{T3}%{T-}
format-padding = 1
click-left    = thunar &

;==========================================================;
;                  Modules: Center                         ;
;==========================================================;

[module/date]
type     = internal/date
interval = 10

date     = %a, %b %d
date-alt = %A, %B %d, %Y
time     = %I:%M %p

; date-alt/time-alt auto-binds left-click to the built-in toggle action.
; Right-click is wired via an action tag to show a calendar popup.
format           = %{A3:~/.config/polybar/calendar.sh &:}%{F#FFAF60}%{T3} %{T-}%{F-} <label>%{A}
format-underline = ${colors.orange}
label            = %date%  %time%

;==========================================================;
;                  Modules: Right                          ;
;==========================================================;

[module/cpu]
type     = internal/cpu
interval = 2

format                   = <label>
format-prefix = "%{T3} %{T-}"
format-prefix-foreground = ${colors.alert}
format-underline         = ${colors.alert}
label                    = "%percentage:2%%"

[module/memory]
type     = internal/memory
interval = 2

format                   = <label>
format-prefix = "%{T3} %{T-}"
format-prefix-foreground = ${colors.secondary}
format-underline         = ${colors.secondary}
label                    = "%gb_used%"

[module/sound]
type       = internal/pulseaudio
use-ui-max = true
interval   = 5

format-volume          = %{T3}<ramp-volume>%{T-} <label-volume>
format-volume-underline = ${colors.green}
label-volume           = %percentage%%

format-muted           = <label-muted>
format-muted-prefix = "%{T3} %{T-}"
format-muted-underline         = ${colors.disabled}
label-muted                    = Muted

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

[module/ethernet]
; internal/network hides the module when %local_ip% is briefly empty (USB
; dongle + DHCP delay) — backed by ethernet.sh instead.
type             = custom/script
exec             = ~/.config/polybar/ethernet.sh
interval         = 3
format-underline = ${colors.green}
click-right      = nm-connection-editor &

[module/wifi]
type           = internal/network
interface-type = wireless
interval       = 3.0

; internal/network ignores click-left/right — wired via action tags instead.
; Colors are hardcoded hex (${colors.x} breaks inside nested %{...} tags).
format-connected                    = %{A1:~/.config/polybar/wifi-menu.sh &:}%{A3:nm-connection-editor &:}%{F#249824}%{T3}%{T-}%{F-} <ramp-signal> <label-connected>%{A}%{A}
format-connected-underline          = ${colors.green}
label-connected                     = %essid% (%signal%%)

ramp-signal-0 = ▂
ramp-signal-1 = ▄
ramp-signal-2 = ▆
ramp-signal-3 = █
ramp-signal-foreground = ${colors.green}

format-disconnected                    = %{A1:~/.config/polybar/wifi-menu.sh &:}%{A3:nm-connection-editor &:}%{F#D95B5B}%{T3}%{T-}%{F-} <label-disconnected>%{A}%{A}
format-disconnected-underline          = ${colors.alert}
label-disconnected                     = Disconnected

[module/vpn]
type             = custom/script
exec             = ~/.config/polybar/check-vpn.sh
interval         = 5
format-underline = ${colors.blue}
click-left       = ~/.config/polybar/vpn-menu.sh &
click-right      = nm-connection-editor &

[module/battery]
; internal/battery misreads charge-threshold "paused" as Discharging with a
; bogus time estimate — backed by UPower instead (battery.sh).
type             = custom/script
exec             = ~/.config/polybar/battery.sh
interval         = 15
format-underline = ${colors.orange}
click-left       = ~/.config/polybar/battery-menu.sh &
click-right      = ~/.config/polybar/battery.sh --info &

[module/powermenu]
type             = custom/text
format = %{T3}%{T-}
format-foreground = ${colors.blue}
format-padding   = 1
click-left       = sh ~/.config/polybar/powermenu.sh &

[module/bluetooth]
type             = custom/script
exec             = ~/.config/polybar/bluetooth.sh
interval         = 3
format-underline = ${colors.blue}
click-left       = ~/.config/polybar/bluetooth.sh --toggle &
click-right      = blueman-manager &
